<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Selamanya Itu Lama Banget — Reader</title>

  <!-- ============================================================
       FEATURE — SEO & SOCIAL SHARE PREVIEW (Open Graph + Twitter Card)
       Dipakai oleh crawler WhatsApp, Facebook/Meta Sharing Debugger,
       Telegram, Discord, dll untuk menampilkan kartu preview saat
       link domain ini dibagikan.

       PENTING — ini wajib URL ABSOLUT (bukan relatif "asset/preview.jpg"),
       karena crawler pihak ketiga (WhatsApp dkk) tidak selalu resolve
       path relatif dengan benar. Sesuaikan domain di bawah kalau
       domain Vercel berubah, dan pastikan file gambarnya benar‑benar
       ada di "asset/preview.jpg" (huruf besar/kecil harus identik
       dengan nama folder yang di-deploy).
       ============================================================ -->
  <meta name="description" content="Selamanya Itu Lama Banget — novel digital kisah Ariel & Alie. Baca langsung di browser, lengkap dengan musik latar, mode fokus, dan catatan pribadi per bab.">
  <link rel="canonical" href="https://novel-ariel-alie.vercel.app/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Selamanya Itu Lama Banget">
  <meta property="og:locale" content="id_ID">
  <meta property="og:url" content="https://novel-ariel-alie.vercel.app/">
  <meta property="og:title" content="Selamanya Itu Lama Banget">
  <meta property="og:description" content="Novel digital kisah Ariel & Alie. Baca langsung di browser, lengkap dengan musik latar, mode fokus, dan catatan pribadi per bab.">
  <meta property="og:image" content="https://novel-ariel-alie.vercel.app/asset/preview.jpg">
  <meta property="og:image:secure_url" content="https://novel-ariel-alie.vercel.app/asset/preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Selamanya Itu Lama Banget — Novel Ariel & Alie">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Selamanya Itu Lama Banget">
  <meta name="twitter:description" content="Novel digital kisah Ariel & Alie. Baca langsung di browser, lengkap dengan musik latar, mode fokus, dan catatan pribadi per bab.">
  <meta name="twitter:image" content="https://novel-ariel-alie.vercel.app/asset/preview.jpg">

  <!-- ============================================================
       FEATURE — OFFLINE PWA SUPPORT (manifest & ikon)
       ============================================================ -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e0926d">

  <!-- Favicon Tab Browser
       Urutan penting: browser baca dari atas ke bawah
       • SVG  → browser modern (Chrome 73+, Firefox, Edge 79+) — tajam di semua ukuran
       • 32px → fallback untuk browser yang belum support SVG favicon
       • 16px → fallback ukuran paling kecil (tab sempit)
  -->
  <link rel="icon" href="/icons/icon.svg"    type="image/svg+xml">
  <link rel="icon" href="/icons/icon-32.png" type="image/png"    sizes="32x32">
  <link rel="icon" href="/icons/icon-16.png" type="image/png"    sizes="16x16">

  <!-- Apple Touch Icon (iOS "Add to Home Screen" & iMessage preview) -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png" sizes="192x192">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
